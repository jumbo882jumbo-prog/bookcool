<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - E-Book Store</title>
    <!-- โหลด Tailwind CSS จาก CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
    <!-- โหลด auth.js -->
    <script src="auth.js"></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- 1. แถบนำทางด้านบน Navbar -->
    <header class="border-b border-white/10 bg-slate-900/60 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 text-white hover:opacity-90 transition">
                <span class="bg-blue-600 text-white px-2.5 py-1 rounded-lg font-bold text-sm shadow-sm">E</span>
                <span class="font-bold text-lg tracking-wide">E-Book Store</span>
            </a>
            <a href="index.html" class="text-xs text-gray-300 hover:text-white transition flex items-center gap-1">
                ← กลับไปหน้าร้านค้า
            </a>
        </div>
    </header>

    <!-- 2. ส่วนเนื้อหาหลัก: การ์ดเข้าสู่ระบบ -->
    <main class="max-w-md w-full mx-auto px-4 py-8 sm:py-12 flex-grow flex flex-col justify-center">

        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-6 sm:p-8">

            <!-- หัวข้อแบบฟอร์ม -->
            <div class="text-center mb-6">
                <div class="inline-flex p-3 bg-blue-50 text-blue-600 rounded-2xl mb-3 shadow-inner text-2xl">
                    🔐
                </div>
                <h1 id="authTitle" class="text-2xl font-bold text-gray-900">เข้าสู่ระบบ E-Book Store</h1>
                <p id="authSubtitle" class="text-xs text-gray-500 mt-1">
                    เข้าสู่ระบบเพื่อจัดการหนังสือหรือเลือกซื้อ E-Book
                </p>
            </div>

            <!-- แถบสลับ เข้าสู่ระบบ / สมัครสมาชิก -->
            <div class="flex border-b border-gray-200 mb-5">
                <button type="button" id="tabLogin" onclick="switchTab('login')"
                    class="flex-1 pb-2.5 text-xs font-bold text-blue-600 border-b-2 border-blue-600 transition cursor-pointer">
                    เข้าสู่ระบบ
                </button>
                <button type="button" id="tabRegister" onclick="switchTab('register')"
                    class="flex-1 pb-2.5 text-xs font-bold text-gray-400 hover:text-gray-600 transition cursor-pointer">
                    สมัครสมาชิกใหม่
                </button>
            </div>

            <!-- ฟอร์มเข้าสู่ระบบ (Login Form) -->
            <form id="loginForm" onsubmit="handleLoginForm(event)" class="space-y-4">
                <div>
                    <label for="loginUsername" class="block text-xs font-semibold text-gray-700 mb-1">
                        ชื่อผู้ใช้ หรือ อีเมล <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="loginUsername" required placeholder="กรอกชื่อผู้ใช้หรืออีเมล"
                        class="w-full text-xs border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div>
                    <label for="loginPassword" class="block text-xs font-semibold text-gray-700 mb-1">
                        รหัสผ่าน <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="loginPassword" required placeholder="••••••••"
                        class="w-full text-xs border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl text-xs transition shadow-md hover:shadow-lg cursor-pointer flex items-center justify-center gap-1.5 mt-2">
                    <span>🚀</span> เข้าสู่ระบบ
                </button>
            </form>

            <!-- ฟอร์มสมัครสมาชิก (Register Form - ซ่อนไว้ก่อน) -->
            <form id="registerForm" onsubmit="handleRegisterForm(event)" class="space-y-3.5 hidden">
                <div>
                    <label for="regName" class="block text-xs font-semibold text-gray-700 mb-1">ชื่อ-นามสกุล หรือชื่อเล่น <span class="text-red-500">*</span></label>
                    <input type="text" id="regName" required placeholder="สมชาย ใจดี"
                        class="w-full text-xs border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="regEmail" class="block text-xs font-semibold text-gray-700 mb-1">อีเมล <span class="text-red-500">*</span></label>
                    <input type="email" id="regEmail" required placeholder="somchai@example.com"
                        class="w-full text-xs border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="regUsername" class="block text-xs font-semibold text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username) <span class="text-red-500">*</span></label>
                    <input type="text" id="regUsername" required placeholder="somchai123"
                        class="w-full text-xs border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="regPassword" class="block text-xs font-semibold text-gray-700 mb-1">รหัสผ่าน <span class="text-red-500">*</span></label>
                    <input type="password" id="regPassword" required placeholder="รหัสผ่านอย่างน้อย 4 ตัวอักษร" minlength="4"
                        class="w-full text-xs border border-gray-300 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <input type="hidden" id="regRole" value="user">

                <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl text-xs transition shadow-md hover:shadow-lg cursor-pointer flex items-center justify-center gap-1.5 mt-2">
                    <span>✨</span> สร้างบัญชีและเข้าสู่ระบบทันที
                </button>
            </form>

            <!-- ข้อมูลความปลอดภัย -->
            <div class="mt-6 pt-4 border-t border-gray-100 text-[11px] text-gray-500 text-center space-y-1">
                <p>🔒 ระบบตรวจสอบสิทธิ์ความปลอดภัย (RBAC Authorization)</p>
                <p class="text-gray-400">กรุณาล็อกอินด้วยชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน</p>
            </div>

        </div>

    </main>

    <!-- 3. ส่วนท้าย Footer -->
    <footer class="text-center py-4 text-xs text-gray-400">
        <p>© 2026 E-Book Store Authentication Security System.</p>
    </footer>

    <!-- จาวาสคริปต์ควบคุมการทำงานของหน้าเข้าสู่ระบบ -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || (urlParams.get('role') === 'admin' ? 'admin.html' : 'index.html');

        // สลับแท็บ เข้าสู่ระบบ / สมัครสมาชิก
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabReg = document.getElementById('tabRegister');
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-2.5 text-xs font-bold text-blue-600 border-b-2 border-blue-600 transition cursor-pointer";
                tabReg.className = "flex-1 pb-2.5 text-xs font-bold text-gray-400 hover:text-gray-600 transition cursor-pointer";
                title.innerText = "เข้าสู่ระบบ E-Book Store";
                subtitle.innerText = "เข้าสู่ระบบเพื่อจัดการหนังสือหรือเลือกซื้อ E-Book";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 pb-2.5 text-xs font-bold text-green-600 border-b-2 border-green-600 transition cursor-pointer";
                tabLogin.className = "flex-1 pb-2.5 text-xs font-bold text-gray-400 hover:text-gray-600 transition cursor-pointer";
                title.innerText = "สมัครสมาชิก E-Book Store";
                subtitle.innerText = "กรอกข้อมูลเพื่อสร้างบัญชีผู้ใช้งานใหม่";
            }
        }

        // ประมวลผลการกดเข้าสู่ระบบปกติ (ต้องใช้ชื่อผู้ใช้และรหัสผ่าน)
        function handleLoginForm(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const res = auth.login(username, password);
            if (res.success) {
                const u = res.user;
                alert(`🎉 เข้าสู่ระบบสำเร็จ!\nยินดีต้อนรับ: "${u.name}" (${u.role === 'admin' ? 'ผู้ดูแลระบบ Admin' : 'สมาชิกทั่วไป'})`);

                const isAdminTarget = redirectUrl.includes('admin') || redirectUrl.includes('add-book') || redirectUrl.includes('reports') || redirectUrl.includes('sql-console');
                if (u.role === 'admin') {
                    window.location.href = isAdminTarget ? redirectUrl : 'admin.html';
                } else {
                    window.location.href = isAdminTarget ? 'index.html' : redirectUrl;
                }
            } else {
                alert('❌ เข้าสู่ระบบไม่สำเร็จ: ' + res.message);
            }
        }

        // ประมวลผลการสมัครสมาชิกใหม่
        function handleRegisterForm(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const role = (document.getElementById('regRole') ? document.getElementById('regRole').value : 'user') || 'user';

            const res = auth.register(name, email, username, password, role);
            if (res.success) {
                alert(`🎉 สมัครสมาชิกและเข้าสู่ระบบสำเร็จ!\nยินดีต้อนรับคุณ "${name}"`);
                window.location.href = 'index.html';
            } else {
                alert('❌ เกิดข้อผิดพลาด: ' + res.message);
            }
        }
    </script>
</body>

</html>
