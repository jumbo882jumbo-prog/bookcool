<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า - E-Book Store</title>
    <!-- โหลด Tailwind CSS จาก CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
    <!-- ระบบจัดการสิทธิ์ผู้ใช้และล็อกอิน -->
    <script src="auth.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- 1. แถบนำทางด้านบน (Navbar) -->
    <header class="bg-gray-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- โลโก้ (คลิกกลับไปที่ index.html) -->
            <a href="index.html" class="flex items-center space-x-2 hover:opacity-90 transition">
                <span class="bg-blue-600 text-white px-2 py-1 rounded font-bold text-sm">E</span>
                <span class="font-bold text-lg tracking-wide">E-Book Store</span>
            </a>
            
            <div class="flex items-center space-x-3 sm:space-x-4 text-sm">
                <!-- ปุ่มกลับไปหน้าเลือกซื้อหนังสือ (คลิกกลับไปที่ index.html) -->
                <a href="index.html" class="text-sm text-gray-300 hover:text-white flex items-center gap-1 transition">
                    🏠 ซื้อหนังสือต่อ
                </a>
                <!-- ลิงก์ไปหน้าหนังสือของฉัน -->
                <a href="my-books.html" class="text-sm text-gray-300 hover:text-white flex items-center gap-1 transition">
                    📚 หนังสือของฉัน
                </a>
                <!-- ส่วนแสดงสถานะล็อกอินและบัญชีผู้ใช้งาน (Auth Nav Container) -->
                <div class="auth-nav-container flex items-center"></div>
            </div>
        </div>
    </header>

    <!-- 2. เนื้อหาหลักของตะกร้าสินค้า -->
    <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-grow">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>🛒</span> ตะกร้าสินค้าของคุณ
            </h1>
            <a href="index.html" class="text-sm text-blue-600 hover:underline flex items-center gap-1">
                ← ซื้อหนังสือเพิ่ม
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
            <div class="p-6 divide-y divide-gray-100" id="cartItemList">
                <!-- ข้อมูลหนังสือในตะกร้าจะโหลดที่นี่ด้วย JavaScript -->
            </div>

            <!-- สรุปยอดเงินและปุ่มดำเนินการชำระเงิน -->
            <div id="cartSummaryContainer" class="bg-gray-50 p-6 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <p class="text-sm text-gray-500" id="cartSummaryCount">ยอดรวมทั้งสิ้น (0 เล่ม)</p>
                    <h2 class="text-2xl font-bold text-blue-600" id="cartSummaryTotal">฿0.00</h2>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <!-- ปุ่มกลับไปเลือกซื้อหนังสือ -->
                    <a href="index.html#bookSection"
                        class="text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-6 py-3 rounded-xl transition">
                        ← เลือกซื้อหนังสือต่อ
                    </a>
                    <!-- ปุ่มดำเนินการชำระเงิน (เชื่อมโยงไป checkout.html) -->
                    <a id="btnCheckout" href="checkout.html"
                        class="text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl shadow hover:shadow-md transition">
                        💳 ดำเนินการชำระเงิน →
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 3. ส่วนท้ายเว็บ (Footer) -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <div class="flex flex-wrap justify-center gap-6 mb-2">
            <a href="index.html" class="hover:text-blue-600">หน้าแรก</a>
            <a href="cart.html" class="hover:text-blue-600 font-semibold text-blue-600">ตะกร้าสินค้า</a>
            <a href="checkout.html" class="hover:text-blue-600">ชำระเงิน</a>
            <a href="my-books.html" class="hover:text-blue-600">หนังสือของฉัน</a>
            <a href="admin.html" class="admin-link-nav hover:text-red-600">ระบบหลังบ้าน (Admin)</a>
        </div>
        <p>© 2026 E-Book Store Mini Project. All rights reserved.</p>
    </footer>

    <script>
        function renderCart() {
            const listEl = document.getElementById('cartItemList');
            const summaryCount = document.getElementById('cartSummaryCount');
            const summaryTotal = document.getElementById('cartSummaryTotal');
            const btnCheckout = document.getElementById('btnCheckout');
            
            const cart = cartManager.getCart();

            if (!cart || cart.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12">
                        <div class="text-5xl mb-3">🛒</div>
                        <h3 class="text-lg font-bold text-gray-700">ตะกร้าสินค้าของคุณยังว่างเปล่า</h3>
                        <p class="text-xs text-gray-400 mt-1 mb-6">คุณยังไม่ได้เพิ่มหนังสือเล่มใดลงในตะกร้า</p>
                        <a href="index.html#bookSection" class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-6 py-3 rounded-xl shadow transition">
                            📖 เลือกซื้อหนังสือหน้าร้าน
                        </a>
                    </div>
                `;
                summaryCount.innerText = "ยอดรวมทั้งสิ้น (0 เล่ม)";
                summaryTotal.innerText = "฿0.00";
                btnCheckout.classList.add('opacity-50', 'pointer-events-none');
                return;
            }

            btnCheckout.classList.remove('opacity-50', 'pointer-events-none');
            
            let totalCount = 0;
            let totalPrice = 0;

            listEl.innerHTML = cart.map(item => {
                const qty = item.quantity || 1;
                const itemTotal = (parseFloat(item.price) || 0) * qty;
                totalCount += qty;
                totalPrice += itemTotal;

                return `
                <div class="flex flex-col sm:flex-row items-center justify-between py-4 gap-4" id="item-${item.id}">
                    <div class="flex items-center gap-4 w-full sm:w-auto">
                        <img src="${item.cover}"
                            alt="${item.title}" 
                            class="w-16 h-20 object-cover rounded-lg shadow-sm"
                            onerror="this.src='https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=100'">
                        <div>
                            <h3 class="font-bold text-base text-gray-900">${item.title}</h3>
                            <p class="text-xs text-gray-500">ผู้แต่ง: ${item.author || 'ไม่ระบุ'}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs text-blue-600 font-medium bg-blue-50 px-2 py-0.5 rounded inline-block">
                                    ${item.category || 'E-Book'}
                                </span>
                                <span class="text-xs text-gray-500 font-medium">
                                    จำนวน: ${qty} เล่ม
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between w-full sm:w-auto gap-6">
                        <span class="font-bold text-lg text-blue-600">฿${itemTotal.toFixed(2)}</span>
                        <button onclick="handleRemoveItem('${item.id}', '${item.title}')" 
                            class="text-red-500 hover:text-red-700 text-xs font-semibold px-2.5 py-1.5 rounded-lg hover:bg-red-50 transition cursor-pointer">
                            🗑️ ลบออก
                        </button>
                    </div>
                </div>`;
            }).join('');

            summaryCount.innerText = `ยอดรวมทั้งสิ้น (${totalCount} เล่ม)`;
            summaryTotal.innerText = `฿${totalPrice.toFixed(2)}`;
        }

        function handleRemoveItem(bookId, bookTitle) {
            if (confirm(`คุณต้องการนำหนังสือ "${bookTitle}" ออกจากตะกร้าใช่หรือไม่?`)) {
                cartManager.removeFromCart(bookId);
                renderCart();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderCart);
        } else {
            renderCart();
        }

        window.addEventListener('pageshow', renderCart);
        window.addEventListener('storage', (e) => {
            if (e.key === 'cart_items') renderCart();
        });
        window.addEventListener('cartUpdated', renderCart);
    </script>
</body>

</html>
